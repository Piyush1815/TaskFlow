

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Kanban Board</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="app-header">
        <div class="logo">
            <h1>TaskFlow</h1>
            <p>Manage your work efficiently</p>
        </div>

        <button class="add-task-btn" id="focus-add-task" type="button">
            + Add Task
        </button>
    </header>

    <main>
        <form class="task-form" id="task-form">
            <h2>Add a New Task</h2>

            <input
                type="text"
                id="task-title"
                placeholder="Enter task title"
                required
            >

            <select id="task-priority">
                <option value="low">Low Priority</option>
                <option value="medium">Medium Priority</option>
                <option value="high">High Priority</option>
            </select>

            <button type="submit">Add Task</button>
        </form>

        <div class="board" id="board">

            <section class="column" data-status="todo">
                <h2>To Do (<span class="task-count">0</span>)</h2>
                <div class="task-list"></div>
            </section>

            <section class="column" data-status="doing">
                <h2>In Progress (<span class="task-count">0</span>)</h2>
                <div class="task-list"></div>
            </section>

            <section class="column" data-status="done">
                <h2>Done (<span class="task-count">0</span>)</h2>
                <div class="task-list"></div>
            </section>

        </div>
    </main>

</body>
</html>
